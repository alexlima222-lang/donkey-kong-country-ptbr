name: Verificar conteúdo público
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Conferir patches, hashes e arquivos
        run: python3 scripts/verificar_repositorio.py
      - name: Conferir sintaxe dos scripts
        run: python3 -m compileall -q scripts
